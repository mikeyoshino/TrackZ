<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TrackZ · Choose exercises reference</title>
  <style>
    :root { color-scheme: dark; --bg:#070a0c; --surface:#151a1e; --line:#2c343b; --muted:#929aa5; --lime:#baff2c; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#202631; color:#f5f7f8; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif; }
    .phone { width:390px; height:844px; padding:54px 18px 24px; display:grid; grid-template-rows:auto auto auto 1fr auto auto; gap:12px; overflow:hidden; background:var(--bg); border-radius:48px; }
    .nav { height:44px; display:grid; grid-template-columns:44px 1fr 44px; align-items:center; text-align:center; font-size:17px; font-weight:700; }
    .back { display:grid; place-items:center; width:44px; height:44px; border:1px solid var(--line); border-radius:22px; font-size:28px; }
    .search { height:50px; display:flex; align-items:center; padding:0 16px; border:1px solid var(--line); border-radius:25px; background:#111417; color:var(--muted); font-size:17px; }
    .filters { min-height:44px; display:flex; gap:8px; overflow:hidden; }
    .chip { min-height:44px; padding:0 16px; display:grid; place-items:center; border:1.5px solid var(--lime); border-radius:18px; white-space:nowrap; font-size:16px; }
    .chip.active { background:var(--lime); color:#101400; }
    .list { min-height:0; overflow:hidden; display:grid; gap:12px; align-content:start; }
    .card { min-height:112px; display:grid; grid-template-columns:88px 1fr 24px; gap:12px; align-items:center; padding:12px; border:1px solid var(--line); border-radius:18px; background:var(--surface); }
    .art { width:88px; height:88px; display:grid; place-items:center; border-radius:12px; background:#252c32; color:var(--lime); font-size:28px; }
    .name { font-size:18px; font-weight:700; }
    .meta { margin-top:4px; color:var(--muted); font-size:15px; line-height:1.4; }
    .select { color:var(--lime); font-size:28px; }
    .actions { min-height:72px; display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; padding:10px 12px; border:1px solid var(--line); border-radius:18px; background:#0d1114; }
    button { border:0; min-height:50px; padding:0 20px; border-radius:16px; font:inherit; font-weight:700; }
    .quiet { background:transparent; color:#c7cdd3; }
    .done { background:var(--lime); color:#101400; }
    .count { color:var(--muted); text-align:center; font-size:15px; }
    .tabs { height:64px; display:flex; justify-content:space-around; align-items:center; border:1px solid var(--line); border-radius:32px; background:#111416; color:var(--muted); }
    .tabs strong { color:var(--lime); }
  </style>
</head>
<body>
  <main class="phone"
        data-native-title-count="1"
        data-page-margin="18"
        data-search-height="50"
        data-filter-height="44"
        data-card-gap="12"
        data-selected-count="1"
        data-actions-navbar-gap="12">
    <header class="nav"><span class="back">‹</span><span>Choose exercises</span><span></span></header>
    <div class="search">⌕&nbsp;&nbsp;Search exercises</div>
    <div class="filters"><span class="chip">All</span><span class="chip active">Back</span><span class="chip">Chest</span><span class="chip">Shoulders</span></div>
    <section class="list">
      <article class="card"><div class="art">↟</div><div><div class="name">Assisted Pull-Up</div><div class="meta">Assistance<br>LAST&nbsp; 15 kg assist × 8<br>PR&nbsp; 15 kg assist × 8</div></div><div class="select">✓</div></article>
      <article class="card"><div class="art">↔</div><div><div class="name">Barbell Row</div><div class="meta">Weight<br>LAST&nbsp; 3 kg × 2<br>PR&nbsp; 3 kg × 2</div></div><div class="select">○</div></article>
    </section>
    <footer class="actions"><button class="quiet">Create custom</button><span class="count">Selected: 1</span><button class="done">Done</button></footer>
    <nav class="tabs"><strong>Train</strong><span>History</span><span>Progress</span><span>You</span></nav>
  </main>
</body>
</html>
