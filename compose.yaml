services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trackz
      POSTGRES_USER: trackz
      POSTGRES_PASSWORD: trackz_local_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackz -d trackz"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${TRACKZ_MINIO_ACCESS_KEY:-trackz_local}
      MINIO_ROOT_PASSWORD: ${TRACKZ_MINIO_SECRET_KEY:-trackz_local_development_secret}
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - minio-data:/data
  minio-bootstrap:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${TRACKZ_MINIO_ACCESS_KEY:-trackz_local}
      MINIO_ROOT_PASSWORD: ${TRACKZ_MINIO_SECRET_KEY:-trackz_local_development_secret}
      TRACKZ_OBJECT_STORAGE_ACCESS_KEY: ${TRACKZ_OBJECT_STORAGE_ACCESS_KEY:-trackz_api}
      TRACKZ_OBJECT_STORAGE_SECRET_KEY: ${TRACKZ_OBJECT_STORAGE_SECRET_KEY:-trackz_api_local_development_secret}
    entrypoint: ["/bin/sh", "-ec", "attempt=0; until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do attempt=$$((attempt + 1)); test $$attempt -lt 20; sleep 1; done; mc mb --ignore-existing local/trackz-private; mc anonymous set none local/trackz-private; printf 'ready' | mc pipe local/trackz-private/health/readiness >/dev/null; printf '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\",\"s3:DeleteObject\"],\"Resource\":[\"arn:aws:s3:::trackz-private/*\"]},{\"Effect\":\"Allow\",\"Action\":[\"s3:GetLifecycleConfiguration\",\"s3:PutLifecycleConfiguration\"],\"Resource\":[\"arn:aws:s3:::trackz-private\"]}]}' >/tmp/trackz-api.json; if ! mc admin policy info local trackz-api-lifecycle >/dev/null 2>&1; then mc admin policy create local trackz-api-lifecycle /tmp/trackz-api.json; fi; if ! mc admin user info local $$TRACKZ_OBJECT_STORAGE_ACCESS_KEY >/dev/null 2>&1; then mc admin user add local $$TRACKZ_OBJECT_STORAGE_ACCESS_KEY $$TRACKZ_OBJECT_STORAGE_SECRET_KEY; fi; mc admin policy attach local trackz-api-lifecycle --user $$TRACKZ_OBJECT_STORAGE_ACCESS_KEY"]
volumes:
  minio-data:
